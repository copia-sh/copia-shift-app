name = "copia-shift-ics-feed"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# ここに書く値は秘密ではないのでコミットして構わない。
# 秘密情報(FIREBASE_SERVICE_ACCOUNT_KEY、AGENT_API_TOKEN、MCP_API_TOKEN、
# SHIFT_SYNC_SPREADSHEET_ID)はここに書かず、
# `wrangler secret put <名前> --config worker/wrangler.toml` で登録する。
#
# AGENT_GROUP_ID   運用エージェント向けAPI(`/agent/shifts`)が読むグループ。
#                  空のままなら、そのAPIは無効(404)のまま。
[vars]
FIREBASE_PROJECT_ID = "copia-shift-app"
AGENT_GROUP_ID = "2iogHeS5UYKAJKccFwqk"
# SHIFT_SYNC_ENABLED  シフトのスプレッドシート同期。"true" のときだけ Cron が動く。
#                     Google Sheets API の有効化と、サービスアカウントへの編集共有が
#                     完了後に true へ切り替える。
# 同期先の SHIFT_SYNC_SPREADSHEET_ID は、このリポジトリが公開されているため vars に置かず
# シークレットとして登録する(スプレッドシートIDは実質URLと同じで、漏れると存在が特定される)。
SHIFT_SYNC_ENABLED = "true"
# TASK_SYNC_ENABLED  タスク表(スタダチーム_タスク表)を Firestore の taskBoard/current へ取り込む。
#                    "true" のときだけ、上の5分ごとの Cron のうち0・15・30・45分の回で動く。
#                    取り込み元の TASK_BOARD_SPREADSHEET_ID は secret で登録し、
#                    サービスアカウントにそのシートを「閲覧者」で共有してから true にする。
TASK_SYNC_ENABLED = "true"
# TASK_EDIT_ENABLED  アプリのタスク画面から進捗（ステータス・状況メモ・成果物）をタスク表へ即時に書き込む
#                    POST /tasks/update を有効にする。サービスアカウントをタスク表の「編集者」にしてから true にする。
# TASK_API_ALLOWED_ORIGIN  アプリの配信元。これ以外のオリジンからの呼び出しは断る(CORS)。
TASK_EDIT_ENABLED = "true"
TASK_API_ALLOWED_ORIGIN = "https://copia-sh.github.io"

# 一覧の自習室予定。サービスアカウントへの閲覧共有・secret登録後に有効化する。
# STUDY_ROOM_CALENDAR_SPREADSHEET_ID / STUDY_ROOM_SURVEY_SPREADSHEET_ID は secret。
# Slackを読んだ運用エージェントが、管理表「自習室アンケート」へ開催回とリンクを記録する。
STUDY_ROOM_SYNC_ENABLED = "true"
STUDY_ROOM_SURVEY_SHEET_TITLE = "自習室アンケート"

# 5分ごとに実行し、そのうち0分・30分の回だけ `シフト月間表`(30日分)も書く。
# 30日分を5分ごとに読むとFirestoreの無料枠(1日50,000読み取り)を超えるため、
# 人が読む表は頻度を落とす。判定は実行時刻で行う(worker/src/index.ts の
# shouldIncludeMatrix)。Cron式を2本にすると0分・30分に二重で発火する。
[triggers]
crons = ["*/5 * * * *"]
